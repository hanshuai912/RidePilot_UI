<section><div class="recovery-head"><h3>现在感觉如何</h3><small>按自身感受选择</small></div><div class="scope-list" role="radiogroup" aria-label="当前感受"><button class="scope" role="radio" aria-checked="true"><span class="scope-copy"><strong>感觉正常</strong><small>没有明显疲劳或酸痛</small></span><span class="check">✓</span></button><button class="scope" role="radio" aria-checked="false"><span class="scope-copy"><strong>仍有疲劳</strong><small>希望降低近期训练压力</small></span><span class="check"></span></button><button class="scope" role="radio" aria-checked="false"><span class="scope-copy"><strong>需要充分恢复</strong><small>希望先休息或安排轻松骑行</small></span><span class="check"></span></button></div></section>
<section><h3>调整哪些训练</h3><div class="recovery-scopes" role="radiogroup" aria-label="调整范围"><button role="radio" aria-checked="false" data-note="只调整最近一节尚未完成的训练。">下一节</button><button role="radio" aria-checked="false" data-note="调整本周尚未完成的训练安排。">本周剩余</button><button role="radio" aria-checked="true" data-note="调整下一周的训练，本周安排保持不变。">下周</button></div><p class="scope-hint">调整下一周的训练，本周安排保持不变。</p></section>
<section><div class="recovery-head"><h3>比赛与恢复情况</h3><small>选填</small></div><textarea aria-label="比赛与恢复情况" maxlength="240" placeholder="例如：周日完成 100 公里公路赛，骑了 4 小时，目前双腿酸胀，希望先轻松骑行。"></textarea><p class="counter">0/240</p></section>
<div class="recovery-context"><div><small>当前目标</small><div><p>提升耐力</p><small>2030-04-01</small></div></div><p class="footnote">基于正式计划 v2 生成草稿，预览确认后生效。已完成的训练会保留。</p></div><a class="primary" href="A05-race-recovery.md#生成与异常">生成恢复草稿</a></div></main><p class="caption">390 × 844 pt · 合成示例<br>布局与交互预览；实际生成由 App 执行。</p></div><script>document.querySelectorAll('[role=radiogroup]').forEach(group=>{group.querySelectorAll('[role=radio]').forEach(button=>{button.addEventListener('click',()=>{group.querySelectorAll('[role=radio]').forEach(other=>{const selected=other===button;other.setAttribute('aria-checked',String(selected));const check=other.querySelector('.check');if(check)check.textContent=selected?'✓':'';});if(button.dataset.note)document.querySelector('.scope-hint').textContent=button.dataset.note;});});});document.querySelector('textarea').addEventListener('input',event=>{document.querySelector('.counter').textContent=event.target.value.length+'/240';});</script></body></html>
