<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>T04 · 编辑课程</title><link rel="stylesheet" href="visual-system.css"><style>
*{box-sizing:border-box}body{margin:0;background:#0d0f0e;color:#eff0e9}.phone{max-width:430px;margin:auto}header{position:sticky;top:0;z-index:1;background:#0d0f0e;border-bottom:1px solid #292f29;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 20px}header h1{font-size:17px!important;line-height:24px!important}header button{min-width:44px;min-height:44px}.content{padding:24px 20px 36px;display:grid;gap:24px}.section{display:grid;gap:12px}h2{margin:0;font-size:18px;line-height:24px}h3{margin:0;font-size:16px;line-height:22px}p{margin:0}small,label{font-size:14px;line-height:20px;color:#a2a99f}.context{display:flex;justify-content:space-between;gap:8px;align-items:center}.badge{font-size:13px;line-height:18px;color:#c9ba91;background:#373628;padding:4px 8px;border-radius:8px}.card{border:1px solid #313731;background:#191c1a;border-radius:16px;padding:16px}.fields{display:grid;gap:16px}label{display:grid;gap:8px}input{width:100%;min-height:48px;background:#232723;color:#eff0e9;border:1px solid #313731;border-radius:12px;padding:12px;font-size:16px;line-height:24px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metrics strong{display:block;font-size:22px;line-height:28px;color:#c9ba91;margin-top:4px}.chart{display:flex;align-items:end;gap:2px;height:100px;border-bottom:1px solid #939b91;margin:16px 0}.chart i{background:#90ad98;flex:1}.chart i:first-child,.chart i:last-child{background:#8b948c}.segment{padding:0;overflow:hidden}.segment-head{display:flex;align-items:center;gap:8px;padding:4px;min-height:48px}.segment-head h3{flex:1}.segment-head button{min-width:44px;min-height:44px}.delete{color:#cf837b}.segment-body{display:grid;gap:8px;padding:0 16px 16px}.intensity{justify-self:start;background:#373628;color:#c9ba91;font-size:14px;line-height:20px;padding:4px 8px;border-radius:6px}.edit{display:flex;justify-content:space-between;color:#c9ba91;font-size:14px;min-height:44px;align-items:center}.add{border:1px dashed #313731;border-radius:12px;min-height:48px;color:#c9ba91}.primary{min-height:52px;background:#c9ba91;color:#171913;border-radius:12px;font-size:16px;font-weight:600}.actions{display:grid;gap:8px;padding-top:8px;border-top:1px solid #292f29}button,a{font-family:inherit}button{background:transparent;border:0;color:inherit;font-size:16px}a{text-decoration:none}
</style></head><body><main class="phone"><header><button aria-label="返回">←</button><h1>编辑课程</h1><span style="width:44px"></span></header><div class="content"><div class="context"><small>11 月 12 日 · 第 1 节</small><span class="badge">课程草稿</span></div><section class="section"><h2>课程信息</h2><div class="card fields"><label>课程名称（选填）<input value="有氧耐力骑行"></label><label>训练目的（选填）<input value="稳定节奏，建立基础"></label></div></section><section class="section"><h2>课程概览</h2><div class="card"><div class="metrics"><div><small>时间目标</small><strong>60 分钟</strong></div><div><small>距离目标</small><strong>—</strong></div></div><div class="chart" role="img" aria-label="示例：热身10分钟，训练45分钟，放松5分钟"><i style="height:35%;flex:10"></i><i style="height:65%;flex:45"></i><i style="height:30%;flex:5"></i></div><small>10 分钟热身 · 45 分钟训练 · 5 分钟放松</small></div></section><section class="section"><h2>训练动作 · 3 个</h2><small>长按六点图标拖动排序</small><article class="card segment"><div class="segment-head"><button aria-label="拖动第1个动作排序">⠿</button><h3>1 · 热身</h3><button class="delete" aria-label="删除第1个动作">×</button></div><div class="segment-body"><small>时间 · 10 分钟</small><span class="intensity">FTP 45–55%</span><a class="edit" href="#" aria-label="编辑第1个动作">编辑参数 <span>›</span></a></div></article><article class="card segment"><div class="segment-head"><button aria-label="拖动第2个动作排序">⠿</button><h3>2 · 训练</h3><button class="delete" aria-label="删除第2个动作">×</button></div><div class="segment-body"><small>时间 · 45 分钟</small><span class="intensity">FTP 60–70%</span><a class="edit" href="#" aria-label="编辑第2个动作">编辑参数 <span>›</span></a></div></article><article class="card segment"><div class="segment-head"><button aria-label="拖动第3个动作排序">⠿</button><h3>3 · 放松</h3><button class="delete" aria-label="删除第3个动作">×</button></div><div class="segment-body"><small>时间 · 5 分钟</small><span class="intensity">FTP 30–40%</span><a class="edit" href="#" aria-label="编辑第3个动作">编辑参数 <span>›</span></a></div></article><button class="add">＋ 添加动作</button><small>支持 %FTP 或绝对功率，每个动作需填写强度范围。</small></section><div class="actions"><button class="primary">保存当天课程</button><button style="min-height:44px;color:#c9ba91">返回</button></div><small>静态视觉参考，全部数值为示例。应用流程以运行时为准。</small></div></main></body></html>
