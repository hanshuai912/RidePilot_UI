<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>O01 · 新用户引导</title>
  <link rel="stylesheet" href="../flows/initial-plan-flow.css">
  <style>
    .prototype-layout { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 25px; }
    .device-column { display: flex; flex-direction: column; align-items: center; }
    .phone { width: 390px; height: 844px; }
    .static-actions { position: absolute; bottom: 0; left: 0; right: 0; display: flex; gap: 9px; padding: 12px 17px 16px; background: #131714; border-top: 1px solid #2c332d; }
    .static-actions a { display: flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; }
    .caption { color: #a8aea7; font-size: 12px; margin-top: 13px; }
  </style>
</head>
<body>
  <div class="prototype-layout">
    <main class="device-column">
      <div class="phone" aria-label="O01 新用户引导首步 390pt 高保真设计">
        <div class="status-bar" aria-hidden="true">
          <span>9:41</span>
          <span class="system-icons">
            <svg width="18" height="13" viewBox="0 0 18 13"><path d="M1 10V8m4 2V6m4 4V4m4 6V2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <svg width="16" height="13" viewBox="0 0 16 13"><path d="M1 4c4-4 10-4 14 0M4 7c2-2 6-2 8 0M7 10h2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>
            <svg width="23" height="12" viewBox="0 0 23 12"><rect x=".6" y=".6" width="19" height="10.8" rx="2.3" stroke="currentColor" fill="none"/><rect x="2.5" y="2.5" width="14.8" height="7" rx="1" fill="currentColor"/><path d="M21 4v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
        </div>
        <div class="screen-scroll">
          <header class="app-header">
            <a class="back" href="../flows/initial-plan-flow.html#frame-entry" aria-label="返回">‹</a>
            <div class="header-copy"><small>新用户引导 · 第 1 步</small><h1>骑行基础</h1></div>
          </header>
          <div class="progress-label"><span>先告诉我你的骑行基础</span><strong>1 / 4</strong></div>
          <div class="progress-rail"><div style="width:25%"></div></div>
          <section class="surface card-pad">
            <span class="eyebrow">训练经验</span>
            <h2 style="font-size:18px;margin:7px 0 4px">你目前处于哪个阶段？</h2>
            <p class="body-copy">用于控制计划起点和解释方式，不代表能力评级。</p>
            <div class="choice-grid" style="margin-top:15px">
              <button class="choice active wide">刚开始骑行</button>
              <button class="choice wide">规律骑行</button>
              <button class="choice wide">有系统训练</button>
            </div>
            <label class="form-label">你是否有可用的功率数据？</label>
            <div class="choice-grid">
              <button class="choice">有 FTP / 功率计</button>
              <button class="choice active">没有功率计</button>
            </div>
            <p class="field-hint">没有功率数据时，计划会优先使用时长、RPE 和恢复反馈，不生成未经测定的瓦数。</p>
          </section>
          <section class="surface card-pad" style="margin-top:12px">
            <div class="summary-line"><span>已读取的个人资料</span><strong>可修改</strong></div>
            <div class="summary-line"><span>页面昵称</span><strong>骑行者</strong></div>
            <div class="summary-line"><span>时区</span><strong>跟随设备</strong></div>
          </section>
          <p class="small-note">已有资料会自动复用；缺少的关键资料会在生成前明确提示。</p>
        </div>
        <div class="static-actions">
          <a class="primary" href="../flows/initial-plan-flow.html#frame-goal">下一步</a>
          <a class="secondary" href="../flows/initial-plan-flow.html#frame-entry">返回</a>
        </div>
      </div>
      <div class="caption">O01 · 新用户引导 · 骑行基础 · 390 × 844 pt</div>
    </main>
  </div>
</body>
</html>
