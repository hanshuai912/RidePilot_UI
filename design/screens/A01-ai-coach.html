le{display:flex;align-items:baseline;justify-content:space-between;margin:25px 2px 13px}.section-title h2{font-size:20px;letter-spacing:-.02em;margin:0}.section-title span{font-size:12px;color:var(--muted)}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.action{min-height:84px;border:1px solid var(--border);border-radius:17px;background:var(--surface);padding:12px 12px 11px;text-align:left;display:flex;align-items:flex-start;gap:10px}.action-icon{height:32px;width:32px;border-radius:9px;display:grid;place-items:center;flex:none;background:#313127;color:var(--gold)}.action:nth-child(2) .action-icon{background:#273029;color:var(--green)}.action:nth-child(3) .action-icon{background:#2e2d27;color:var(--orange)}.action:nth-child(4) .action-icon{background:#292e2a;color:var(--sub)}.action-text{min-width:0}.action strong{display:block;font-size:13px;font-weight:650;line-height:1.2;margin:1px 0 5px}.action small{font-size:11px;color:var(--muted);line-height:1.25;display:block}.more-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.more{height:45px;border:1px solid #3a413a;border-radius:12px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:600;color:var(--sub)}.more svg{color:var(--gold)}.proposal-section{margin-top:25px}.proposal-heading{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 12px}.proposal-heading h2{font-size:20px;margin:0;letter-spacing:-.02em}.proposal-heading button{border:0;background:transparent;color:var(--gold);font-size:12px;min-height:44px;padding:0}.proposal{background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:16px}.proposal-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.proposal-state{display:flex;align-items:center;gap:7px;color:var(--gold);font-size:11px;font-weight:700}.proposal-state i{width:6px;height:6px;background:var(--gold);border-radius:50%}.proposal-time{font-size:11px;color:var(--muted)}.proposal h3{font-size:17px;letter-spacing:-.02em;margin:12px 0 12px}.diff{background:#242923;border-radius:11px;padding:12px 13px;display:flex;align-items:center;gap:9px}.diff .value{display:flex;flex-direction:column;gap:2px;flex:1}.diff small{color:var(--muted);font-size:10px}.diff strong{font-size:14px;font-weight:650;font-variant-numeric:tabular-nums}.diff .before strong{color:var(--sub)}.diff .after strong{color:var(--text)}.diff .arrow{color:var(--gold);font-size:18px}.impact{font-size:11px;color:var(--sub);line-height:1.4;margin:11px 0 14px}.impact b{font-weight:650;color:var(--orange)}.primary{width:100%;height:52px;border:1px solid var(--gold);border-radius:12px;background:var(--gold);color:var(--gold-on);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px}.proposal-note{text-align:center;color:var(--muted);font-size:11px;margin:9px 0 0}.chat-entry{border:1px solid var(--border);border-radius:17px;background:var(--surface);padding:15px;margin-top:22px;display:flex;gap:12px;align-items:center}.chat-icon{width:36px;height:36px;background:#282c29;border-radius:10px;display:grid;place-items:center;color:var(--green);flex:none}.chat-entry .copy{flex:1}.chat-entry strong{font-size:13px}.chat-entry p{font-size:11px;color:var(--muted);margin:4px 0 0}.chat-entry .go{color:var(--sub);font-size:20px}.tabbar{position:absolute;bottom:0;left:0;right:0;height:82px;background:#121513;box-shadow:0 -1px 0 #2b302b;display:grid;grid-template-columns:repeat(5,1fr);padding:10px 4px 16px}.tab{border:0;background:transparent;color:#8e968e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;padding:0}.tab svg{width:24px;height:24px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.tab.active{color:var(--gold);font-weight:650}.caption{font-size:12px;color:#a8aea7;text-align:center;margin:14px 0 0}@media(max-w
