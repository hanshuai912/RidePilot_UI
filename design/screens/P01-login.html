<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>P01 · 登录</title><link rel="stylesheet" href="auth.css"></head><body data-mode="login"><div class="desktop"><main class="phone" aria-label="登录页面设计原型"><div class="status"><span>9:41</span><span class="status-icons"><img src="../assets/icons/status-signal.svg" alt=""><img src="../assets/icons/status-wifi.svg" alt=""><img src="../assets/icons/status-battery.svg" alt=""></span></div><div class="screen"><header class="auth-top"><a class="back" href="P01-welcome.html" aria-label="返回欢迎页"><img src="../assets/icons/chevron-left.svg" alt=""></a><span class="eyebrow">继续你的骑行计划</span></header><div><span class="eyebrow">欢迎回来</span><h1>登录账号</h1><p class="subhead">使用注册时填写的 11 位号码与密码，继续查看你的训练计划。</p></div><form class="form" data-auth-form novalidate><div class="field"><div class="field-head"><label for="identifier">11 位号码</label><span class="field-hint">注册号码</span></div><input class="input" id="identifier" name="identifier" data-identifier type="text" inputmode="numeric" autocomplete="username" placeholder="请输入注册时的 11 位号码" aria-describedby="identifier-help"><p class="help" id="identifier-help" data-identifier-help>请输入恰好 11 位数字</p></div><div class="field"><div class="field-head"><label for="password">密码</label></div><div class="input-wrap"><input class="input password-input" id="password" name="password" data-password type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="password-help"><button class="show-password" type="button" data-toggle-password aria-label="显示密码">显示</button></div><p class="help" id="password-help" data-password-help>请输入注册时设置的密码</p></div><p class="feedback" data-feedback></p><button class="primary" type="submit">登录</button></form><p class="switch-page">还没有账号？ <a href="P01-register.html">创建账号</a></p><p class="privacy">请妥善保管注册号码与密码。<br><button type="button" data-open-privacy>查看数据与隐私说明</button></p></div><div data-privacy-sheet hidden><div class="sheet-shade" data-close-privacy></div><section class="sheet" role="dialog" aria-modal="true" aria-label="数据与隐私说明"><h2>账号与数据</h2><p>登录后仅可读取当前账号的训练、身体与饮食资料。开发阶段号码不代表已验证手机号。</p><ul><li>密码错误时保持未登录，已有计划不会改变。</li><li>号码或密码不正确时，不会进入账号。</li><li>个人资料应仅用于提供相应的训练与饮食服务。</li></ul><button class="secondary" type="button" data-close-privacy>我知道了</button></section></div></main><p class="caption">P01 · 登录 · 390 × 844 pt</p></div><script src="auth.js"></script></body></html>
